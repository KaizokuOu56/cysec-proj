[package]
name = "file-integrity-monitor"
version = "0.1.0"
edition = "2021"
authors = ["Vinayak Vishwanathan"]
description = "A Linux-based File Integrity Monitor that detects file changes using SHA256 hashing and MySQL storage"

[dependencies]
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
mysql = "25"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
chrono = "0.4"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "fim"
path = "src/main.rs"
